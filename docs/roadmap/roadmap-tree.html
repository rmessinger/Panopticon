<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panopticon Roadmap Tree — interactive viewer</title>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --fg:#e6edf3; --muted:#8b949e; --border:#30363d; --accent:#388bfd; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
           background:var(--bg); color:var(--fg); }
    header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; }
    header .hint { color:var(--muted); font-size:12px; }
    header a { color:var(--accent); }
    .tabs { display:flex; gap:8px; padding:10px 16px 0; flex-wrap:wrap; }
    .tab { padding:6px 12px; border:1px solid var(--border); border-bottom:none; border-radius:6px 6px 0 0;
           background:var(--panel); color:var(--muted); cursor:pointer; user-select:none; }
    .tab.active { color:var(--fg); border-color:var(--accent); }
    .view { position:relative; height:calc(100vh - 132px); border-top:1px solid var(--border); }
    .diagram { position:absolute; inset:0; display:none; }
    .diagram.active { display:block; }
    .diagram svg { width:100%; height:100%; cursor:grab; }
    .diagram svg:active { cursor:grabbing; }
    .toolbar { position:absolute; right:14px; top:14px; display:flex; gap:6px; z-index:5; }
    .toolbar button { width:34px; height:34px; border:1px solid var(--border); background:var(--panel); color:var(--fg);
                      border-radius:6px; font-size:16px; cursor:pointer; }
    .toolbar button:hover { border-color:var(--accent); }
    .msg { padding:24px; color:var(--muted); max-width:760px; }
    .msg code { background:var(--panel); padding:2px 6px; border-radius:4px; color:var(--fg); }
    .loading { padding:24px; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Panopticon Roadmap Tree</h1>
    <span class="hint">Scroll / pinch to <b>zoom</b>, drag to <b>pan</b>. Diagrams are read live from
      <a href="roadmap-tree.md">roadmap-tree.md</a> (single source of truth).</span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="view" id="view"><div class="loading">Loading diagrams…</div></div>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    // svg-pan-zoom is a UMD script; load it dynamically and await it.
    const loadScript = (src) => new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });

    const view = document.getElementById('view');
    const tabs = document.getElementById('tabs');

    function showMessage(html) { view.innerHTML = `<div class="msg">${html}</div>`; }

    // Extract ```mermaid blocks and their nearest preceding "## " heading from the markdown.
    function extractDiagrams(md) {
      const lines = md.split('\n');
      const out = [];
      let heading = 'Diagram', inBlock = false, buf = [];
      for (const line of lines) {
        if (!inBlock && line.startsWith('## ')) heading = line.replace(/^##\s+/, '').trim();
        if (!inBlock && /^```mermaid\s*$/.test(line)) { inBlock = true; buf = []; continue; }
        if (inBlock && /^```\s*$/.test(line)) { inBlock = false; out.push({ title: heading, code: buf.join('\n') }); continue; }
        if (inBlock) buf.push(line);
      }
      return out;
    }

    async function main() {
      let md;
      try {
        const resp = await fetch('roadmap-tree.md', { cache: 'no-store' });
        if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
        md = await resp.text();
      } catch (e) {
        showMessage(`<h3>Could not load <code>roadmap-tree.md</code>.</h3>
          <p>Browsers block <code>fetch()</code> of local files over <code>file://</code>. Serve this
          folder over HTTP and reload — for example from <code>docs/roadmap/</code>:</p>
          <pre><code>python3 -m http.server 8000</code></pre>
          <p>then open <a href="http://localhost:8000/roadmap-tree.html">http://localhost:8000/roadmap-tree.html</a>.
          (On GitHub, the inline diagrams in <a href="roadmap-tree.md">roadmap-tree.md</a> already have
          built-in pan/zoom controls.)</p>
          <p style="color:#f85149">Error: ${e.message}</p>`);
        return;
      }

      const diagrams = extractDiagrams(md);
      if (!diagrams.length) { showMessage('<p>No <code>```mermaid</code> diagrams found in the markdown.</p>'); return; }

      try { await loadScript('https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js'); }
      catch { /* pan/zoom will degrade to a static, full-size SVG */ }

      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose',
        flowchart: { useMaxWidth: false }, mindmap: { useMaxWidth: false } });

      view.innerHTML = '';
      const panels = [];

      for (let i = 0; i < diagrams.length; i++) {
        const { title, code } = diagrams[i];

        const tab = document.createElement('div');
        tab.className = 'tab' + (i === 0 ? ' active' : '');
        tab.textContent = title;
        tab.onclick = () => activate(i);
        tabs.appendChild(tab);

        const panel = document.createElement('div');
        panel.className = 'diagram' + (i === 0 ? ' active' : '');
        view.appendChild(panel);

        let svgEl = null;
        try {
          const { svg } = await mermaid.render('diagram-' + i, code);
          panel.innerHTML = svg;
          svgEl = panel.querySelector('svg');
          svgEl.removeAttribute('width'); svgEl.removeAttribute('height');
          svgEl.style.maxWidth = 'none';
        } catch (e) {
          panel.innerHTML = `<div class="msg" style="color:#f85149">Failed to render "${title}": ${e.message}</div>`;
        }

        const toolbar = document.createElement('div');
        toolbar.className = 'toolbar';
        panel.appendChild(toolbar);

        let pz = null;
        if (svgEl && window.svgPanZoom) {
          pz = window.svgPanZoom(svgEl, { zoomEnabled: true, controlIconsEnabled: false, fit: true,
            center: true, minZoom: 0.05, maxZoom: 40, zoomScaleSensitivity: 0.3 });
        }
        const mkBtn = (label, title, fn) => {
          const b = document.createElement('button'); b.textContent = label; b.title = title; b.onclick = fn; toolbar.appendChild(b);
        };
        mkBtn('+', 'Zoom in', () => pz && pz.zoomIn());
        mkBtn('−', 'Zoom out', () => pz && pz.zoomOut());
        mkBtn('⤢', 'Fit to view', () => pz && (pz.resize(), pz.fit(), pz.center()));

        panels.push({ panel, tab, pz });
      }

      function activate(idx) {
        panels.forEach((p, j) => {
          p.panel.classList.toggle('active', j === idx);
          p.tab.classList.toggle('active', j === idx);
          if (j === idx && p.pz) { p.pz.resize(); p.pz.fit(); p.pz.center(); }
        });
      }

      window.addEventListener('resize', () => {
        const active = panels.find(p => p.panel.classList.contains('active'));
        if (active && active.pz) { active.pz.resize(); active.pz.fit(); active.pz.center(); }
      });
    }

    main();
  </script>
</body>
</html>
