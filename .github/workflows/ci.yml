name: CI

on:
  push:
    branches:
    - main
    tags:
    - v*

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
        - os: windows-latest
          runtime: win-x64
        - os: macos-latest
          runtime: osx-x64
        - os: ubuntu-latest
          runtime: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.x'

    - name: Install MAUI Mac Catalyst workload
      if: matrix.os == 'macos-latest'
      run: dotnet workload install maui-maccatalyst

    # One step per project: a multi-line pwsh block on Windows reports only the
    # last command's exit code, which hid Simulation.Tests failures. !cancelled() keeps
    # every project reporting after an earlier one fails.
    - name: Test Mathematics
      run: dotnet test test/Panopticon.Mathematics.Tests/Panopticon.Mathematics.Tests.csproj --configuration Release --filter Category!=Interactive --collect:"XPlat Code Coverage"

    - name: Test Simulation
      if: ${{ !cancelled() }}
      run: dotnet test test/Panopticon.Simulation.Tests/Panopticon.Simulation.Tests.csproj --configuration Release --filter Category!=Interactive --collect:"XPlat Code Coverage"

    - name: Test ReplaySketch
      if: ${{ !cancelled() }}
      run: dotnet test test/Panopticon.Tools.ReplaySketch.Tests/Panopticon.Tools.ReplaySketch.Tests.csproj --configuration Release --filter Category!=Interactive --collect:"XPlat Code Coverage"

    - name: Test WorldBuilder
      if: ${{ !cancelled() }}
      run: dotnet test test/Panopticon.Tools.WorldBuilder.Core.Tests/Panopticon.Tools.WorldBuilder.Core.Tests.csproj --configuration Release --filter Category!=Interactive --collect:"XPlat Code Coverage"

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Publish
      run: dotnet publish src/Panopticon.Launcher --configuration Release --runtime ${{ matrix.runtime }} --self-contained --output build/artifacts/${{ matrix.runtime }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.runtime }}
        path: build/artifacts/${{ matrix.runtime }}

  publish:
    needs: build

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    runs-on: windows-latest

    steps:
    - name: Download Artifacts win-x64
      uses: actions/download-artifact@v7
      with:
        name: win-x64

    - name: Download Artifacts osx-x64
      uses: actions/download-artifact@v7
      with:
        name: osx-x64

    - name: Download Artifacts linux-x64
      uses: actions/download-artifact@v7
      with:
        name: linux-x64

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: ${{ github.ref }}
        body: "## Instructions\n1. Download the correct .zip file for your operating system\n2. Linux/Mac: export the path to your game path as an environment variable e.g.: `export CNC_GENERALS_PATH=~/generals/`\n3. Start the `Panopticon.Launcher` executable\n\n## Launcher\nThis executable will start Panopticon with the C&C Generals game files. To specify a different SAGE game, or see what other command line options are available, run `Panopticon.Launcher.exe --help`."
        draft: false
        prerelease: true

    # TODO: Upload Release Assets
    # using actions/upload-a-release-asset
