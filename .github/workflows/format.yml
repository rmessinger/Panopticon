name: Format

on:
  push:
    branches:
    - main

jobs:
  format:
    name: Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.x'

    - name: Check brace newline rule
      run: python3 scripts/check_brace_newline.py .

    - name: Check formatting
      run: dotnet format src --verify-no-changes --verbosity diagnostic
