name: Debug Build

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:
    strategy:
      matrix:
        configuration:
        - Debug

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.x'

    - name: Build
      run: dotnet build src --configuration ${{ matrix.configuration }}

    - name: Test
      run: dotnet test src --configuration ${{ matrix.configuration }} --filter Category!=Interactive
