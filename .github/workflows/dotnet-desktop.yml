name: Debug Build

on:
  push:
    branches:
    - main

jobs:
  build:
    strategy:
      matrix:
        configuration:
        - Debug

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.x'

    - name: Build
      run: dotnet build src/Panopticon.sln --configuration ${{ matrix.configuration }}

    # --blame-crash names the test running when a host crashes and saves a dump.
    - name: Test
      run: dotnet test src/Panopticon.sln --configuration ${{ matrix.configuration }} --filter Category!=Interactive --blame-crash --results-directory TestResults

    - name: Upload crash diagnostics
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: test-crash-diagnostics-${{ matrix.configuration }}
        path: TestResults/
        if-no-files-found: ignore
